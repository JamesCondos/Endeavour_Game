  <script>
/* Shared scoreboard client. No account or external JavaScript SDK is required. */
(function () {
  'use strict';

  const CHALLENGE = 'endeavour-2026-v1';
  const PREFIX = 'endeavour.forecast.pending.v1.';
  const TIMEOUT = 10000;
  const MAX_BATCH = 10;
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  const memory = new Map();
  const successful = new Map();
  const inFlight = new Map();
  const listeners = new Set();
  let networkTail = Promise.resolve();
  let flushing = null;
  let refreshing = null;
  let retryTimer = null;
  let retryNotBefore = 0;

  function error(code, message, retryable) {
    return Object.assign(new Error(message), { code, retryable: !!retryable });
  }

  function config() {
    const source = window.BOOTH_SCOREBOARD_CONFIG || {};
    const url = typeof source.url === 'string' ? source.url.trim() : '';
    const key = typeof source.publishableKey === 'string' ? source.publishableKey.trim() : '';
    if (!url || !key) {
      throw error('NOT_CONFIGURED', 'The shared scoreboard has not been connected yet.', true);
    }
    let target;
    try { target = new URL(url); } catch (_) {
      throw error('INVALID_CONFIG', 'The scoreboard project URL is not valid.', false);
    }
    const localHost = hostname => ['localhost', '127.0.0.1', '[::1]'].includes(hostname);
    const localPage = location.protocol === 'file:' || localHost(location.hostname);
    const supabase = target.protocol === 'https:' && /^[a-z0-9-]+\.supabase\.co$/i.test(target.hostname) && !target.port;
    const localTest = localPage && localHost(target.hostname) && ['http:', 'https:'].includes(target.protocol);
    if ((!supabase && !localTest) || target.username || target.password ||
        target.search || target.hash || !['', '/'].includes(target.pathname)) {
      throw error('INVALID_CONFIG', 'Use the HTTPS Supabase project URL, without a path.', false);
    }
    let publicKey = /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
    if (!publicKey && key.split('.').length === 3) {
      try {
        const payload = key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const claims = JSON.parse(atob(payload.padEnd(Math.ceil(payload.length / 4) * 4, '=')));
        publicKey = claims.role === 'anon';
      } catch (_) { /* Reject malformed or privileged JWTs. */ }
    }
    if (!publicKey) {
      throw error('INVALID_CONFIG', 'Use a public publishable or legacy anon key. Secret keys are not allowed.', false);
    }
    return { url: target.origin, key };
  }

  function configured() {
    try { config(); return true; } catch (_) { return false; }
  }

  function normalize(record) {
    if (!record || !UUID.test(record.submissionId) || record.challengeId !== CHALLENGE ||
        typeof record.name !== 'string' || !record.name.trim() ||
        Array.from(record.name).length > 24 || /[\u0000-\u001f\u007f]/.test(record.name) ||
        !Array.isArray(record.guesses) || record.guesses.length !== 3 ||
        record.guesses.some(value => typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > 1000000)) {
      throw error('INVALID_SUBMISSION', 'Enter a nickname and complete all three predictions before saving.', false);
    }
    return {
      submissionId: record.submissionId.toLowerCase(),
      challengeId: CHALLENGE,
      name: record.name.trim(),
      guesses: record.guesses.slice(),
      created: typeof record.created === 'string' ? record.created : new Date().toISOString()
    };
  }

  function createSubmission(name, guesses) {
    let id;
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      id = window.crypto.randomUUID();
    } else {
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      bytes[6] = (bytes[6] & 15) | 64;
      bytes[8] = (bytes[8] & 63) | 128;
      const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      id = `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }
    return normalize({
      submissionId: id,
      challengeId: CHALLENGE,
      name: typeof name === 'string' ? name.trim().replace(/\s+/g, ' ') : name,
      guesses,
      created: new Date().toISOString()
    });
  }

  function emit(event) {
    listeners.forEach(listener => {
      try { listener(event); } catch (_) { /* A view listener cannot interrupt saving. */ }
    });
  }

  function remember(entry) {
    memory.set(entry.record.submissionId, entry);
    try {
      localStorage.setItem(PREFIX + entry.record.submissionId, JSON.stringify({
        record: entry.record,
        attempts: entry.attempts,
        retryAt: entry.retryAt,
        blocked: entry.blocked
      }));
      entry.durable = true;
    } catch (_) {
      entry.durable = false;
    }
    return entry;
  }

  function readPending() {
    try {
      for (let index = 0; index < localStorage.length; index++) {
        const key = localStorage.key(index);
        if (!key || !key.startsWith(PREFIX)) continue;
        try {
          const raw = JSON.parse(localStorage.getItem(key));
          const record = normalize(raw.record);
          if (key !== PREFIX + record.submissionId || successful.has(record.submissionId)) continue;
          if (!memory.has(record.submissionId)) {
            memory.set(record.submissionId, {
              record,
              attempts: Number.isFinite(raw.attempts) ? Math.max(0, raw.attempts) : 0,
              retryAt: Number.isFinite(raw.retryAt) ? raw.retryAt : 0,
              blocked: raw.blocked === true,
              durable: true
            });
          }
        } catch (_) { /* Leave unreadable records untouched, rather than deleting data. */ }
      }
    } catch (_) { /* Memory queue still works when browser storage is unavailable. */ }
    return Array.from(memory.values()).sort((a, b) => a.record.created.localeCompare(b.record.created));
  }

  function isDurable(recordOrId) {
    const id = typeof recordOrId === 'string' ? recordOrId : recordOrId && recordOrId.submissionId;
    readPending();
    return !!(memory.get(id) && memory.get(id).durable);
  }

  function pendingCount() { return readPending().length; }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = null;
    if (!configured() || navigator.onLine === false || document.visibilityState === 'hidden') return;
    const pending = readPending().filter(entry => !entry.blocked && !inFlight.has(entry.record.submissionId));
    if (!pending.length) return;
    const next = pending.reduce((earliest, entry) => Math.min(earliest, entry.retryAt || 0), Infinity);
    retryTimer = setTimeout(() => { flush(); }, Math.max(1000, Math.max(next, retryNotBefore) - Date.now()));
  }

  async function request(method, payload) {
    const settings = config();
    const controller = new AbortController();
    let timer;
    try {
      return await Promise.race([
        (async () => {
          const response = await fetch(`${settings.url}/rest/v1/rpc/${method}`, {
            method: 'POST',
            headers: { apikey: settings.key, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal,
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer'
          });
          if (!response.ok) {
            const retryable = response.status === 408 || response.status === 429 || response.status >= 500;
            const message = response.status === 429
              ? 'The scoreboard is busy. Your score will be retried shortly.'
              : 'The scoreboard could not accept the request. Please try again.';
            throw Object.assign(error('SERVER_ERROR', message, retryable), { status: response.status });
          }
          try { return await response.json(); } catch (_) {
            throw error('INVALID_RESPONSE', 'The scoreboard returned an unreadable response.', true);
          }
        })(),
        new Promise((_, reject) => {
          timer = setTimeout(() => {
            reject(error('TIMEOUT', 'The scoreboard took too long to respond. Please try again.', true));
            controller.abort();
          }, TIMEOUT);
        })
      ]);
    } catch (failure) {
      if (failure && failure.code) throw failure;
      throw error('NETWORK_ERROR', 'Unable to reach the shared scoreboard. Please check your connection.', true);
    } finally {
      clearTimeout(timer);
    }
  }

  function validMetric(value) { return typeof value === 'number' && Number.isFinite(value) && value >= 0; }

  function savedResponse(value, id) {
    if (!value || value.submissionId !== id || !validMetric(value.mae) || !validMetric(value.aiMae) ||
        !Number.isInteger(value.rank) || value.rank < 1) {
      throw error('INVALID_RESPONSE', 'The scoreboard returned an unexpected score. Saving will be retried.', true);
    }
    return { submissionId: id, mae: value.mae, aiMae: value.aiMae, rank: value.rank };
  }

  async function send(entry) {
    const record = entry.record;
    // Attempt persistence again in case browser storage became available.
    remember(entry);
    emit({ type: 'pending', submissionId: record.submissionId, durable: entry.durable });
    try {
      const result = savedResponse(await request('submit_game_score', {
        p_submission_id: record.submissionId,
        p_challenge_id: record.challengeId,
        p_nickname: record.name,
        p_guesses: record.guesses
      }), record.submissionId);
      retryNotBefore = 0;
      successful.set(record.submissionId, result);
      memory.delete(record.submissionId);
      try { localStorage.removeItem(PREFIX + record.submissionId); } catch (_) { /* Retrying the same ID remains safe. */ }
      emit(Object.assign({ type: 'saved' }, result));
      return result;
    } catch (failure) {
      entry.attempts++;
      entry.retryAt = Date.now() + Math.min(300000, 5000 * Math.pow(2, Math.min(6, entry.attempts - 1)));
      if (failure.retryable) retryNotBefore = entry.retryAt;
      entry.blocked = !failure.retryable && failure.code !== 'INVALID_CONFIG';
      remember(entry);
      failure.submissionId = record.submissionId;
      failure.durable = entry.durable;
      emit({ type: 'error', submissionId: record.submissionId, durable: entry.durable, error: failure });
      throw failure;
    }
  }

  function attempt(entry) {
    const id = entry.record.submissionId;
    if (inFlight.has(id)) return inFlight.get(id);
    // Serial writes bound network usage even if several finished games are queued.
    const job = networkTail.then(() => send(entry));
    networkTail = job.catch(() => {});
    const completion = job.finally(() => {
      inFlight.delete(id);
      scheduleRetry();
    });
    inFlight.set(id, completion);
    return completion;
  }

  function submit(record) {
    let clean;
    try { clean = normalize(record); } catch (failure) { return Promise.reject(failure); }
    if (successful.has(clean.submissionId)) return Promise.resolve(successful.get(clean.submissionId));
    readPending();
    const existing = memory.get(clean.submissionId);
    if (existing && (existing.record.name !== clean.name ||
        JSON.stringify(existing.record.guesses) !== JSON.stringify(clean.guesses))) {
      return Promise.reject(error('INVALID_SUBMISSION', 'A saved game cannot be changed when retrying it.', false));
    }
    const entry = existing || remember({ record: clean, attempts: 0, retryAt: 0, blocked: false, durable: false });
    entry.blocked = false;
    return attempt(entry);
  }

  function flush() {
    if (flushing) return flushing;
    flushing = (async () => {
      let saved = 0;
      if (!configured() || navigator.onLine === false || Date.now() < retryNotBefore) {
        return { saved, pending: pendingCount() };
      }
      const candidates = readPending().filter(entry => !entry.blocked && entry.retryAt <= Date.now()).slice(0, MAX_BATCH);
      for (const entry of candidates) {
        try { await attempt(entry); saved++; } catch (failure) {
          // Pause this batch during an outage; keep every remaining game queued.
          if (failure.retryable || failure.code === 'INVALID_CONFIG') break;
        }
      }
      return { saved, pending: pendingCount() };
    })().finally(() => {
      flushing = null;
      scheduleRetry();
    });
    return flushing;
  }

  function retryPending() {
    // A visitor can retry retained 4xx failures after the owner fixes deployment.
    // Failed retries become blocked again, avoiding an automatic error loop.
    retryNotBefore = 0;
    readPending().forEach(entry => {
      entry.blocked = false;
      entry.retryAt = 0;
      remember(entry);
    });
    return flush();
  }

  function refresh() {
    if (refreshing) return refreshing;
    refreshing = request('get_game_leaderboard', { p_challenge_id: CHALLENGE }).then(value => {
      if (!value || !Array.isArray(value.scores) || !Number.isInteger(value.total) || value.total < 0 ||
          !validMetric(value.aiMae) || value.scores.some(score =>
            !score || typeof score.name !== 'string' || !validMetric(score.mae) || !validMetric(score.aiMae) ||
            typeof score.created !== 'string' || !Number.isInteger(score.rank) || score.rank < 1)) {
        throw error('INVALID_RESPONSE', 'The shared scoreboard returned an unexpected result.', true);
      }
      return {
        scores: value.scores.map(score => ({
          name: score.name, mae: score.mae, aiMae: score.aiMae, created: score.created, rank: score.rank
        })),
        total: value.total,
        aiMae: value.aiMae
      };
    }).finally(() => { refreshing = null; });
    return refreshing;
  }

  function subscribe(listener) {
    if (typeof listener !== 'function') throw new TypeError('A scoreboard listener must be a function.');
    listeners.add(listener);
    return () => listeners.delete(listener);
  }

  window.BoothScoreboard = Object.freeze({
    configured, createSubmission, submit, refresh, flush, retryPending, pendingCount, isDurable, subscribe
  });
  window.addEventListener('online', () => { flush(); });
  window.addEventListener('storage', event => {
    if (event.key && event.key.startsWith(PREFIX)) {
      if (!event.newValue) memory.delete(event.key.slice(PREFIX.length));
      scheduleRetry();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') flush();
  });
  setTimeout(() => { flush(); }, 0);
})();

/* Standalone static game: all assets are bundled locally. */
(() => {
  'use strict';
  const root = document.getElementById('game-view');
  const error = document.getElementById('app-error');
  try {
    if (!window.BoothGame || !window.BoothScoreboard || !window.BOOTH_GAME_DATA?.cases?.length) {
      throw new Error('Missing game files');
    }
    window.BoothGame.mount(root);
    if (window.BoothGame.status().availableCases < 3) {
      throw new Error('Not enough playable cases');
    }
    window.BoothGame.activate();
  } catch (_) {
    root.hidden = true;
    error.hidden = false;
    error.textContent = 'The game could not load. Please refresh the page and try again.';
  }
})();
